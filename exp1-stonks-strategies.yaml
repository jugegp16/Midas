# Landing Experiment 1 (hold vs re-fit), stocks basket.
# Globals/exits copied from stocks-optimized-strategy.yaml.
max_position_pct: 0.66
min_buy_delta: 0.035
min_cash_pct: 0.05
softmax_temperature: 0.2
strategies:
- name: Momentum
  params:
    momentum_scale: 0.02
    window: 19
  weight: 2.25
- name: MeanReversion
  params:
    threshold: 0.12
    window: 40
  weight: 1.0
- name: ProfitTaking
  params:
    gain_threshold: 0.79
- name: ChandelierStop
  params:
    multiplier: 3.25
    window: 22
policy:
  objective: sharpe
  budget: 2000
  restarts: 4
  base_seed: 42
  deployment: best
  cadence_days: 63
  adopt_trigger:
    oos_percentile_below: 10
    drawdown_breach: true
